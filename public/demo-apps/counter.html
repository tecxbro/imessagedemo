<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Sessions</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#192c27;font-family:system-ui,sans-serif;padding:28px 22px}small{letter-spacing:.16em;text-transform:uppercase;font-size:10px;color:#697a73}h1{font-size:34px;letter-spacing:-1.4px;margin:14px 0 8px;line-height:1.05}p{font-size:14px;color:#697a73;line-height:1.5}.card{background:white;border-radius:24px;padding:26px 20px;margin-top:30px;text-align:center;border:1px solid #e6e9e4}output{font-size:82px;font-weight:600;display:block;letter-spacing:-5px;margin:12px}button{border:0;border-radius:15px;background:#244e40;color:white;font:600 14px system-ui;padding:16px 20px;width:100%;cursor:pointer}.secondary{background:#e6eee8;color:#244e40;margin-top:10px}label{display:block;font-size:12px;margin-top:26px;color:#61756b}input{display:block;padding:12px;margin:7px 0;width:100%;font:14px system-ui;border:1px solid #d3ded7;border-radius:10px;background:transparent}</style></head><body><small>Make a little progress</small><h1>One thing<br>at a time.</h1><p>Keep track of the sessions you finish today.</p><label>Today's focus<input placeholder="What are you working on?" aria-label="Today's focus"></label><div class="card"><small>Sessions complete</small><output aria-live="polite" id="count">0</output><button id="add">Complete a session</button><button class="secondary" id="reset">Start over</button></div><script>let count=0;const out=document.getElementById('count');document.getElementById('add').onclick=()=>out.textContent=String(++count);document.getElementById('reset').onclick=()=>{count=0;out.textContent='0'};</script></body></html>
